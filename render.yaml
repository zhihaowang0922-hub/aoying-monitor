services:
  - type: web
    name: aoying-binance-monitor
    runtime: python
    region: frankfurt
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python monitor.py
    envVars:
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_CHAT_ID
        sync: false
      - key: PORTFOLIO_ID
        value: "5075281354358777856"
      - key: POLL_INTERVAL
        value: "8"
